# Сборка неподписанного IPA для сайдлоада (SideStore/AltStore подписывают его бесплатным Apple ID).
# Платный Apple Developer не нужен: подпись в Xcode отключена, JS-бандл встраивается в Release.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA (sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: Зависимости монорепо
        script: npm ci
      - name: Сборка domain
        script: npm run build -w @levelup/domain
      - name: Нативный iOS-проект (CNG)
        working_directory: apps/mobile
        script: npx expo prebuild --platform ios --clean
      - name: Release без подписи
        working_directory: apps/mobile/ios
        script: |
          xcodebuild \
            -workspace LevelUp.xcworkspace \
            -scheme LevelUp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty
      - name: Упаковка IPA
        working_directory: apps/mobile/ios
        script: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LevelUp.app Payload/
          zip -qr LevelUp.ipa Payload
    artifacts:
      - apps/mobile/ios/LevelUp.ipa
