# Сборка для App Store: подпись сертификатом аккаунта разработчика и загрузка в
# App Store Connect (оттуда — TestFlight и отправка на ревью). Запуск вручную.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID   — Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      — ключ App Store Connect API (Users and Access → Integrations → Keys, роль App Manager)
#   ASC_ISSUER_ID   — Issuer ID с той же страницы
#   ASC_KEY_P8      — содержимое скачанного файла AuthKey_XXXX.p8 целиком
name: iOS App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Сборка domain
        run: npm run build -w @levelup/domain

      # Team ID и номер сборки — из секретов и счётчика запусков: каждая загрузка новая.
      - name: Team ID и номер сборки
        working-directory: apps/mobile
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          test -n "$TEAM" || { echo "Нет секрета APPLE_TEAM_ID"; exit 1; }
          node -e '
            const f="app.json", j=require("./"+f);
            j.expo.ios.appleTeamId=process.env.TEAM;
            j.expo.ios.buildNumber=process.env.BUILD_NUMBER;
            require("fs").writeFileSync(f, JSON.stringify(j,null,2));'

      - name: Нативный iOS-проект
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Ключ App Store Connect
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY" > ~/private_keys/AuthKey.p8

      # Автоподпись через API-ключ: Xcode сам заводит App ID, группу приложения,
      # профили для приложения и расширения виджетов.
      - name: Архив
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Hrum.xcworkspace -scheme Hrum -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Hrum.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            -quiet

      - name: Загрузка в App Store Connect
        working-directory: apps/mobile/ios
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Hrum.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Убрать ключ
        if: always()
        run: rm -rf ~/private_keys
