# Неподписанный IPA для сайдлоада (SideStore/AltStore подписывают его бесплатным Apple ID).
# Публичный репозиторий → минуты macOS-раннеров бесплатны без лимита.
name: iOS IPA

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/domain/**', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Сборка domain
        run: npm run build -w @levelup/domain

      - name: Нативный iOS-проект (CNG + pod install)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Release без подписи
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Hrum.xcworkspace \
            -scheme Hrum \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build

      # Без подписи в бинарнике нет entitlements, и SideStore при переподписи не даст
      # HealthKit. Ad-hoc подпись («-») вшивает права, сертификат для этого не нужен.
      - name: Ad-hoc подпись с правами (HealthKit)
        working-directory: apps/mobile/ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Hrum.app
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements Hrum/Hrum.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Упаковка IPA
        working-directory: apps/mobile/ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Hrum.app Payload/
          zip -qr Hrum.ipa Payload
          ls -lh Hrum.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Hrum-ipa
          path: apps/mobile/ios/Hrum.ipa

      # Постоянная ссылка для телефона: .../releases/download/latest/Hrum.ipa
      - name: Релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apps/mobile/ios/Hrum.ipa \
            --title "Хрум — свежая сборка" \
            --notes "Коммит ${GITHUB_SHA::7}. Открой ссылку на IPA в SideStore (+ → вставить URL) или скачай и открой файлом." \
            --latest
